    <script>
      // Single Page Application redirect for GitHub Pages project sites
      var segments = location.pathname.split('/').filter(Boolean);
      if (segments.length > 0) {
        // Redirect back to the project root directory /<repo>/
        location.replace('/' + segments[0] + '/');
      } else {
        location.replace('/');
      }
    </script>
  </head>
